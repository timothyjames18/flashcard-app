<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashGen</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 600px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; }
    .auth-box { background: #f5f5f5; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { width: 100%; padding: 10px; margin: 5px 0; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button.secondary { background: #6c757d; }
    button.success { background: #28a745; }
    button.danger { background: #dc3545; }
    #app-view { display: none; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; background: #eee; text-align: center; cursor: pointer; border-radius: 5px; }
    .tab.active { background: #007bff; color: white; }
    .card { 
      background: white; 
      border: 2px solid #333; 
      border-radius: 10px; 
      min-height: 200px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      font-size: 18px; 
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .card.flipped { 
      background: #e8f4fd; 
      border-color: #007bff;
    }
    .card-label {
      font-size: 12px;
      color: #666;
      position: absolute;
      top: 10px;
    }
    .card-content {
      font-size: 20px;
      text-align: center;
      word-wrap: break-word;
      width: 100%;
    }
    .import-box { background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .card-list { list-style: none; padding: 0; }
    .card-item { background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 5px; }
    .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; float: right; }
  </style>
</head>
<body>
  <h1>⚡ FlashGen</h1>
  
  <div id="auth" class="auth-box">
    <h3>Sign Up / Sign In</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
    <button id="signin-btn" class="secondary">Sign In</button>
    <button id="signout-btn" class="secondary" style="display:none;">Sign Out</button>
  </div>
  
  <div id="app-view">
    <div class="tabs">
      <div class="tab active" data-tab="create">Create</div>
      <div class="tab" data-tab="study">Study</div>
      <div class="tab" data-tab="cards">My Cards</div>
    </div>
    
    <div id="create-tab">
      <div class="import-box">
        <h4>Create New Card</h4>
        <input id="card-front" placeholder="Question (Front)">
        <input id="card-back" placeholder="Answer (Back)">
        <button class="success" id="add-card-btn">Add Card</button>
      </div>
      
      <div class="import-box">
        <h4>Import CSV / Text File</h4>
        <p style="font-size:12px;color:#666;">Format: question,answer (one per line)</p>
        <input type="file" accept=".csv,.txt" id="csv-input">
      </div>
    </div>
    
    <div id="study-tab" class="hidden">
      <div style="text-align:center;margin-bottom:10px;">
        Card <span id="card-num">0</span> of <span id="total-cards">0</span>
      </div>
      <div class="card" id="study-card" onclick="flipCard()">
        <div class="card-label" id="card-label">QUESTION</div>
        <div class="card-content" id="card-content">Click "Start Study"</div>
      </div>
      <p style="text-align:center;font-size:14px;color:#666;">Click the card to flip</p>
      <button id="prev-btn">← Previous</button>
      <button id="next-btn" class="success">Next →</button>
      <button class="secondary" id="start-study-btn" style="margin-top:10px;">Start Study</button>
    </div>
    
    <div id="cards-tab" class="hidden">
      <h4>My Cards (<span id="my-card-count">0</span>)</h4>
      <ul class="card-list" id="card-list"></ul>
      <button class="danger" id="clear-all-btn">Delete All Cards</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyeglKC3k9PSYOKe4SL7Bi6pO00kvNr10",
      authDomain: "flashcard-8008e.firebaseapp.com",
      projectId: "flashcard-8008e",
      storageBucket: "flashcard-8008e.firebasestorage.app",
      messagingSenderId: "867702802383",
      appId: "1:867702802383:web:596fdf3f90397d714a34ba"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let allCards = [];
    let studyIndex = 0;
    let isFlipped = false;

    function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password).catch(e => alert(e.message));
    }

    function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password).catch(e => alert(e.message));
    }

    function signOut() { auth.signOut(); }

    function addCard() {
      const front = document.getElementById('card-front').value;
      const back = document.getElementById('card-back').value;
      if (!front || !back) return alert('Fill in both fields');
      db.collection("cards").add({ userId: currentUser.uid, front, back, createdAt: new Date() });
      document.getElementById('card-front').value = '';
      document.getElementById('card-back').value = '';
      loadCards();
    }

    function loadCards() {
      if (!currentUser) return;
      db.collection("cards").where("userId", "==", currentUser.uid).get().then(snapshot => {
        allCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderCardList();
      });
    }

    function deleteCard(id) { db.collection("cards").doc(id).delete().then(loadCards); }

    function clearAllCards() {
      if (!confirm('Delete all?')) return;
      allCards.forEach(card => db.collection("cards").doc(card.id).delete());
      loadCards();
    }

    async function importCSV() {
      const file = document.getElementById('csv-input').files[0];
      if (!file) return;
      const text = await file.text();
      const lines = text.split('\n');
      for (const line of lines) {
        const [front, back] = line.split(',');
        if (front && back) {
          db.collection("cards").add({
            userId: currentUser.uid,
            front: front.trim(),
            back: back.trim(),
            createdAt: new Date()
          });
        }
      }
      alert('Cards imported!');
      loadCards();
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('[id$="-tab"]').forEach(t => t.classList.add('hidden'));
      document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
      document.getElementById(tab + '-tab').classList.remove('hidden');
    }

    function flipCard() {
      if (allCards.length === 0) return;
      isFlipped = !isFlipped;
      const card = allCards[studyIndex];
      if (isFlipped) {
        document.getElementById('study-card').classList.add('flipped');
        document.getElementById('card-label').innerText = 'ANSWER';
        document.getElementById('card-content').innerText = card.back;
      } else {
        document.getElementById('study-card').classList.remove('flipped');
        document.getElementById('card-label').innerText = 'QUESTION';
        document.getElementById('card-content').innerText = card.front;
      }
    }

    function startStudy() {
      if (allCards.length === 0) return alert('No cards to study!');
      studyIndex = 0;
      isFlipped = false;
      showStudyCard();
    }

    function showStudyCard() {
      const card = allCards[studyIndex];
      isFlipped = false;
      document.getElementById('study-card').classList.remove('flipped');
      document.getElementById('card-label').innerText = 'QUESTION';
      document.getElementById('card-content').innerText = card.front;
      document.getElementById('card-num').innerText = studyIndex + 1;
      document.getElementById('total-cards').innerText = allCards.length;
    }

    function nextCard() { if (studyIndex < allCards.length - 1) { studyIndex++; showStudyCard(); } }
    function prevCard() { if (studyIndex > 0) { studyIndex--; showStudyCard(); } }

    function renderCardList() {
      document.getElementById('card-list').innerHTML = allCards.map(c => 
        '<li class="card-item">' + c.front + ' → ' + c.back + ' <button class="delete-btn" onclick="deleteCard(\'' + c.id + '\')">×</button></li>'
      ).join('');
      document.getElementById('my-card-count').innerText = allCards.length;
    }

    document.getElementById('signup-btn').onclick = signUp;
    document.getElementById('signin-btn').onclick = signIn;
    document.getElementById('signout-btn').onclick = signOut;
    document.getElementById('add-card-btn').onclick = addCard;
    document.getElementById('csv-input').onchange = importCSV;
    document.getElementById('clear-all-btn').onclick = clearAllCards;
    document.getElementById('start-study-btn').onclick = startStudy;
    document.getElementById('prev-btn').onclick = prevCard;
    document.getElementById('next-btn').onclick = nextCard;

    document.querySelectorAll('.tab').forEach(tab => { tab.onclick = () => showTab(tab.dataset.tab); });

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        document.getElementById('signout-btn').style.display = 'block';
        loadCards();
      } else {
        document.getElementById('auth').style.display = 'block';
        document.getElementById('app-view').style.display = 'none';
        document.getElementById('signout-btn').style.display = 'none';
      }
    });
  </script>
</body>
</html>
